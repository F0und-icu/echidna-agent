# Text-only example. Replace URL/model and export the referenced key before chat.
# Confirm every capability below against your service; these are sample values.
# Save your real configuration outside the source repository.
schema_version = 1
active_agent_profile = "default"

[providers.primary]
binding = "http_sse"
wire_api = "responses"
base_url = "https://responses.example.invalid/v1"
model = "replace-with-your-model"
credential_ref = "CYBER_AGENT_PRIMARY_API_KEY"
# Alternatively remove credential_ref and use a local inline key:
# api_key = "replace-with-your-api-key"
capability_mapping = "primary-v1"
generation = 1

[capability_mappings.primary-v1]
version = 1
text_input = true
image_input = false
streaming = true
tool_call = true
structured_output = true
incremental_input = false
usage_reporting = true
# Example capacity, not a detected or guaranteed model capability.
context_window = 32768

[agent_profiles.default]
primary = "primary"
vision_mode = "disabled"
generation = 1

[runtime]
# 0 disables the per-Turn request ceiling; the default is 32.
model_request_limit_per_turn = 32
# Optional, for the isolated compaction sample only; omitted inherits primary.
# compaction_reasoning_effort = "high"

# Optional budget policy. 100 basis points = 1%; omitted fields use defaults.
[runtime.context_budget]
pressure_bps = 8000
target_bps = 5000
summary_bps = 200
compaction_reference_items = 64
max_core_file_bytes = 524288
# max_content_bytes = 1048576
