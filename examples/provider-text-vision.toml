# A text primary model handles reasoning/tools; a separate model analyzes images.
# Replace both URLs/models and export both referenced keys before starting chat.
# Confirm every capability below against each service; these are sample values.
# Save your real configuration outside the source repository.
schema_version = 1
active_agent_profile = "default"

[providers.primary]
binding = "http_sse"
wire_api = "responses"
base_url = "https://text.example.invalid/v1"
model = "replace-with-your-text-model"
credential_ref = "CYBER_AGENT_PRIMARY_API_KEY"
capability_mapping = "text-v1"
generation = 1

[providers.vision]
binding = "http_sse"
wire_api = "responses"
base_url = "https://vision.example.invalid/v1"
model = "replace-with-your-vision-model"
credential_ref = "CYBER_AGENT_VISION_API_KEY"
capability_mapping = "vision-v1"
generation = 1

[capability_mappings.text-v1]
version = 1
text_input = true
image_input = false
streaming = true
tool_call = true
structured_output = true
incremental_input = false
usage_reporting = true
# Example capacity, not a detected or guaranteed model capability.
context_window = 32768

[capability_mappings.vision-v1]
version = 1
text_input = true
image_input = true
streaming = true
tool_call = false
structured_output = true
incremental_input = false
usage_reporting = true
# Configure this model's own window, independently of the primary model.
context_window = 32768

[agent_profiles.default]
primary = "primary"
vision = "vision"
vision_mode = "secondary_tool"
generation = 1

[runtime]
# Shared by primary and vision requests within one operator turn.
model_request_limit_per_turn = 32
