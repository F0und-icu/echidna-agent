# Codex-compatible ChatGPT subscription; this file contains no credentials.
# Replace the absolute private store path, then use auth select-model --provider codex.
# Use a store distinct from SIWC; the store's parent directory must already exist
# and no ancestor may be a symlink.
schema_version = 1
active_agent_profile = "codex_subscription"

[providers.codex]
binding = "http_sse"
wire_api = "responses"
base_url = "https://chatgpt.com/backend-api/codex"
model = "REPLACE_WITH_ACCOUNT_MODEL_SLUG"
codex_subscription = { account = "personal", auth_store = "/REPLACE_WITH_PRIVATE_DIRECTORY/echidna-codex-auth" }
# Optional explicit catalog compatibility declaration. It changes only the
# catalog request's client_version query and version header; it does not
# guarantee new model IDs, account access, or an installed Codex release.
# codex_subscription = { account = "personal", auth_store = "/REPLACE_WITH_PRIVATE_DIRECTORY/echidna-codex-auth", catalog_client_version = "0.144.0" }
capability_mapping = "codex-subscription-text-v1"
generation = 1

[capability_mappings.codex-subscription-text-v1]
version = 1
text_input = true
image_input = false
streaming = true
tool_call = true
structured_output = false
incremental_input = false
usage_reporting = true
# Explicit conservative example, not an inferred account/model limit.
context_window = 32768
# Do not set max_output_tokens: this Codex subscription route does not support it.
# Optional explicit effort; auth select-model validates it against the account catalog.
# reasoning_effort = "xhigh"

[agent_profiles.codex_subscription]
primary = "codex"
vision_mode = "disabled"
generation = 1

[runtime]
auto_compact = true
# compaction_reasoning_effort = "high"

# Optional: ratios scale with the actual declared window, not the model name.
# 100 basis points = 1%. Other policy fields retain their defaults.
[runtime.context_budget]
pressure_bps = 8000
target_bps = 5000
summary_bps = 200
compaction_reference_items = 64
max_core_file_bytes = 524288
# max_content_bytes = 1048576
