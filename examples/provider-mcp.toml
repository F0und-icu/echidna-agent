# Text model plus explicitly configured HTTP or Unix stdio MCP tools.
# This file contains no credentials. Copy it outside the repository before use.
# Each MCP server is discovered only when `chat` starts; `doctor` remains offline.
schema_version = 1
active_agent_profile = "default"

[providers.primary]
binding = "http_sse"
wire_api = "responses"
base_url = "https://responses.example.invalid/v1"
model = "replace-with-your-model"
credential_ref = "CYBER_AGENT_PRIMARY_API_KEY"
capability_mapping = "primary-v1"
generation = 1
connect_timeout_ms = 30000
read_timeout_ms = 300000  # Read-idle timeout, not the total task duration.

[capability_mappings.primary-v1]
version = 1
text_input = true
image_input = false
streaming = true
tool_call = true
structured_output = true
incremental_input = false
usage_reporting = true
# Example capacity. Confirm it with the configured model service.
context_window = 272000

[agent_profiles.default]
primary = "primary"
vision_mode = "disabled"
generation = 1

[mcp_servers.example]
# Absolute HTTP(S) Streamable HTTP endpoint, with no userinfo, query or fragment.
url = "https://mcp.example.invalid/mcp"
# Select exactly one implemented MCP protocol path.
protocol_version = "2026-07-28"
# Optional dedicated MCP Bearer reference. Do not reuse a model-provider key.
credential_ref = "CYBER_AGENT_MCP_EXAMPLE_API_KEY"
# Optional; defaults to 60000 and must be from 1 through 86400000.
timeout_ms = 60000
# Startup, initialize and tool discovery share this separate total deadline.
# Omission inherits timeout_ms.
startup_timeout_ms = 60000

# Optional local stdio server. Remove/replace the HTTP entry above if unused.
# Exactly one url or command selects transport for each server.
# [mcp_servers.local]
# command = "python3"
# args = ["/absolute/path/to/server.py", "--transport", "stdio"]
# protocol_version = "2025-11-25"
# cwd = "."
# env = { MY_TOOL_SETTING = "explicit-value" }
# timeout_ms = 60000
# startup_timeout_ms = 60000
# Bare commands use PATH. Relative command paths/cwd resolve from this file's
# directory; cwd defaults there. args/env remain literal: no shell/$VAR expansion.
# Child env inherits only PATH, HOME, USER, LOGNAME, TMPDIR, TMP, TEMP, LANG,
# LC_ALL, LC_CTYPE, TZ, plus explicit env. Provider/vendor keys are not inherited.
# credential_ref is HTTP-only. Never commit real environment secrets.

[runtime]
# Shared by primary, vision, compaction and model transport retries.
# 0 disables the per-Turn request ceiling; the default is 32.
model_request_limit_per_turn = 32
# Opt in to compaction at durable settled-batch/completed-Turn boundaries.
auto_compact = false
# Optional: same primary model's isolated compaction scope only.
# Omitted inherits primary; set only an effort supported by that service.
# compaction_reasoning_effort = "high"

# Ratios use basis points: 100 = 1%, 10000 = 100%.
# Reserves use the declared window; other content shares use usable input.
[runtime.context_budget]
output_reserve_bps = 1250
tool_loop_reserve_bps = 1250
pressure_bps = 8000
target_bps = 5000
summary_bps = 200
tool_output_bps = 3200
core_memory_bps = 1600
state_section_bps = 10
continuation_field_bps = 40
continuation_goal_part_bps = 16
readback_default_bps = 100
readback_max_bps = 400
compaction_reference_items = 64  # Per reference kind; unit: items.
max_core_file_bytes = 524288     # Core storage cap; unit: bytes.
# Optional absolute content cap in bytes; omitted keeps proportional growth.
# max_content_bytes = 1048576
