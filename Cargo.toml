[package]
name = "cyber-agent"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
async-stream = "0.3.6"
blake3 = "1.8.2"
clap = { version = "4.5", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["fs", "process", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
