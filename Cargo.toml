[package]
name = "echidna"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
async-stream = "0.3.6"
blake3 = "1.8.2"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
eventsource-stream = "0.2.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
hyper = { version = "=1.11.0", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17.14"
portable-pty = { version = "0.9.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8.23"
toml_edit = { version = "0.22.27", features = ["parse", "display"] }
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
vt100 = "=0.16.2"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
