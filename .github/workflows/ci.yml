name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Offline Rust gate and macOS arm64 package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install external test tools
        run: |
          brew install ripgrep
          rg --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check production test layout
        run: |
          if rg -n '#\[cfg\(test\)\]|^[[:space:]]*mod[[:space:]]+tests[[:space:]]*[;{]' src; then
            echo 'inline tests are forbidden under src/' >&2
            exit 1
          fi

      - name: Check generic Provider composition literals
        run: |
          if rg -n 'api\.(openai|deepseek)\.com|CYBER_AGENT_[A-Z0-9_]*MODEL' src tests; then
            echo 'generic runtime and Live Smoke paths must obtain endpoint and model from Config v1' >&2
            exit 1
          fi

      - name: Check one Responses protocol owner
        run: |
          if rg -n 'OpenAiResponses|DeepSeekResponses|adapters::(openai|deepseek)' src tests; then
            echo 'Responses support is protocol-first; vendor Adapter bindings are forbidden' >&2
            exit 1
          fi
          test "$(rg -l '\.bytes_stream\(\)\.eventsource\(\)' src/adapters --glob '*.rs' | wc -l | tr -d ' ')" = 1
          test "$(rg -l 'struct ResponsesRequest' src/adapters --glob '*.rs' | wc -l | tr -d ' ')" = 1
          test "$(rg -l 'fn decode_stream_event' src/adapters --glob '*.rs' | wc -l | tr -d ' ')" = 1

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build
        run: cargo build --locked

      - name: Package macOS arm64 release
        run: ./scripts/package-macos-arm64.sh

      - name: Check distribution failure cases
        run: ./tests/distribution_package.sh dist

      - name: Upload verified macOS arm64 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: echidna-macos-arm64
          path: |
            dist/echidna-*-aarch64-apple-darwin.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
