name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Reuse the offline release gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified personal release
    needs: gate
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Download package produced by the gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: echidna-macos-arm64
          path: dist

      - name: Verify tag and package
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          version=$(./scripts/package-macos-arm64.sh --print-version)
          test "$GITHUB_REF_NAME" = "v$version"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          ./scripts/package-macos-arm64.sh --verify-only dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/echidna-*-aarch64-apple-darwin.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Echidna $GITHUB_REF_NAME" \
            --notes-from-tag
