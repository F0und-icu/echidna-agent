<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Echidna — butterfly and flowing E</title>
  <desc id="description">An ivory E with two flowing curves and a four-wing butterfly ornament, on ink black. Inspired by Echidna's white hair and butterfly hair ornament in Re:Zero.</desc>
  <view id="light" viewBox="0 0 160 160"/>
  <view id="mono" viewBox="0 0 160 160"/>
  <style>
    .surface { fill: #19171f; }
    .letter { stroke: #ece6db; }
    .wing { fill: #ece6db; }
    .body { fill: #a697c3; }
    #light:target ~ .mark .surface { fill: #ece6db; }
    #light:target ~ .mark .letter { stroke: #19171f; }
    #light:target ~ .mark .wing { fill: #19171f; }
    #light:target ~ .mark .body { fill: #69577f; }
    #mono:target ~ .mark .surface { fill: #fff; }
    #mono:target ~ .mark .letter { stroke: #000; }
    #mono:target ~ .mark .wing, #mono:target ~ .mark .body { fill: #000; }
  </style>
  <g class="mark">
    <rect class="surface" width="160" height="160" rx="32"/>
    <path class="letter" d="M84 46H71C29 46 29 83 68 83H94M68 83C27 83 31 124 73 124H112" stroke-width="11" stroke-linecap="round"/>
    <g transform="rotate(-12 113 44)">
      <path class="wing" d="M109 42C96 39 89 27 91 17C104 18 110 27 109 42Z"/>
      <path class="wing" d="M117 42C119 26 128 16 141 14C141 29 131 40 117 42Z"/>
      <path class="wing" d="M108 49C97 47 89 52 88 65C100 68 109 60 108 49Z"/>
      <path class="wing" d="M119 49C130 45 141 51 139 65C127 69 120 61 119 49Z"/>
      <path class="body" d="M113 38C117 43 117 51 114 58C111 53 110 44 113 38Z"/>
    </g>
  </g>
</svg>
